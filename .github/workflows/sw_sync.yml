##############################################################################
# THE PROPER PAINTER — Sherwin-Williams Daily Sync
# ─────────────────────────────────────────────────
# Runs sw_sync.py every morning at 6 AM ET (10:00 UTC / 11:00 UTC during EDT).
# Logs into the SW PRO+ portal, downloads new invoices and payments,
# and pushes them directly to the SW Credit Account tab in Google Sheets.
#
# REQUIRED GITHUB SECRETS (Settings → Secrets and variables → Actions → New):
#   SWILLIAMS_EMAIL            — SW PRO+ portal login email
#   SWILLIAMS_PW               — SW PRO+ portal password
#   SPREADSHEET_ID             — Google Sheet ID (from the Sheets URL)
#   GOOGLE_SERVICE_ACCOUNT_JSON — Full contents of your service_account.json file
#
# ONE-TIME SETUP (see SW_SYNC_SETUP.md for step-by-step):
#   1. Create a Google Cloud project → enable Sheets API
#   2. Create a Service Account → download JSON key
#   3. Share the Google Sheet with the service account email (Editor)
#   4. Add the four secrets above to this GitHub repo
#   5. Push this file to .github/workflows/sw_sync.yml → it runs automatically
##############################################################################

name: SW Credit Account Sync

on:
  schedule:
    # 6 AM ET = 10:00 UTC (EST) / 11:00 UTC (EDT)
    # Runs every day at 10:00 UTC; naturally shifts with daylight saving
    - cron: '0 10 * * *'

  # Allow manual trigger from the Actions tab (useful for testing)
  workflow_dispatch:

jobs:
  sync:
    name: Sync SW Invoices & Payments → Google Sheets
    runs-on: ubuntu-latest
    timeout-minutes: 20   # abort if the script hangs

    steps:

      # ── 1. Check out the repo ───────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install Python dependencies ──────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            playwright \
            python-dotenv \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib

      # ── 4. Install Chromium for Playwright ──────────────────────────────
      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      # ── 5. Write Google service account credentials ──────────────────────
      # The secret contains the full JSON — write it to a temp file.
      # The file is never committed; it only exists for this run.
      - name: Write Google service account credentials
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > /tmp/service_account.json

      # ── 6. Create .env for sw_sync.py ───────────────────────────────────
      - name: Create .env file
        run: |
          cat > PlaidSync/.env << 'EOF'
          SWILLIAMS_EMAIL=${{ secrets.SWILLIAMS_EMAIL }}
          SWILLIAMS_PW=${{ secrets.SWILLIAMS_PW }}
          SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON=/tmp/service_account.json
          EOF

      # ── 7. Run the sync ─────────────────────────────────────────────────
      - name: Run SW sync
        run: python PlaidSync/sw_sync.py

      # ── 8. Upload debug screenshots if the run fails ─────────────────────
      # Playwright saves debug_*.png files when it can't find a page element.
      # These help diagnose SW portal layout changes without re-running locally.
      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sw-sync-debug-screenshots
          path: PlaidSync/debug_*.png
          if-no-files-found: ignore
          retention-days: 7

      # ── 9. Upload sync log on failure ────────────────────────────────────
      - name: Upload sync log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sw-sync-log
          path: PlaidSync/sw_sync.log
          if-no-files-found: ignore
          retention-days: 7
