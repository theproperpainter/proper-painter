##############################################################################
# THE PROPER PAINTER — Sherwin-Williams Daily Sync
# ─────────────────────────────────────────────────
# Runs sw_sync.py every morning at 6 AM ET (10:00 UTC).
# Logs into the SW PRO+ portal, downloads new invoices and payments,
# and pushes them directly to the SW Credit Account tab in Google Sheets.
#
# REQUIRED GITHUB SECRETS (Settings → Secrets and variables → Actions → New):
#   SWILLIAMS_EMAIL         — SW PRO+ portal login email
#   SWILLIAMS_PW            — SW PRO+ portal password
#   SPREADSHEET_ID          — Google Sheet ID (from the Sheets URL)
#   GOOGLE_CREDENTIALS_JSON — Full contents of your oauth_client_secret.json
#   GOOGLE_TOKEN_JSON       — Full contents of token.json (generated on first local run)
#
# ONE-TIME SETUP (see SW_SYNC_SETUP.md for step-by-step):
#   1. Run sw_sync.py once locally — it opens a browser for Google sign-in
#      and saves token.json next to the script
#   2. Copy the contents of token.json as the GOOGLE_TOKEN_JSON secret
#   3. Add the other four secrets above
#   4. Push this file to .github/workflows/sw_sync.yml → runs automatically
##############################################################################

name: SW Credit Account Sync

on:
  schedule:
    # 6 AM ET = 10:00 UTC (EST) / 11:00 UTC (EDT)
    - cron: '0 10 * * *'

  # Allow manual trigger from the Actions tab (useful for testing)
  workflow_dispatch:

jobs:
  sync:
    name: Sync SW Invoices & Payments → Google Sheets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ── 1. Check out the repo ───────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Install Python dependencies ──────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            playwright \
            python-dotenv \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib

      # ── 4. Install Chromium for Playwright ──────────────────────────────
      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      # ── 5. Write Google OAuth credentials ───────────────────────────────
      # oauth_client_secret.json — the app credentials (not user-specific)
      # token.json              — the user's cached OAuth token (no browser needed)
      - name: Write Google OAuth credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > "docs/Financial Workbook/PlaidSync/oauth_client_secret.json"
          echo '${{ secrets.GOOGLE_TOKEN_JSON }}'       > "docs/Financial Workbook/PlaidSync/token.json"

      # ── 6. Create .env for sw_sync.py ───────────────────────────────────
      # NOTE: GOOGLE_CREDENTIALS_JSON is intentionally omitted here.
      # The script defaults to SCRIPT_DIR/oauth_client_secret.json, which is
      # exactly where step 5 writes it. Setting it to a bare filename would
      # resolve relative to the repo root (CWD) instead — wrong directory.
      - name: Create .env file
        run: |
          cat > "docs/Financial Workbook/PlaidSync/.env" <<EOF
SWILLIAMS_EMAIL=${{ secrets.SWILLIAMS_EMAIL }}
SWILLIAMS_PW=${{ secrets.SWILLIAMS_PW }}
SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}
EOF

      # ── 7. Run the sync ─────────────────────────────────────────────────
      - name: Run SW sync
        run: python "docs/Financial Workbook/PlaidSync/sw_sync.py"

      # ── 8. Print sync log to console (always visible in step output) ───────
      - name: Print sync log
        if: always()
        run: |
          LOG="docs/Financial Workbook/PlaidSync/sw_sync.log"
          if [ -f "$LOG" ]; then
            echo "===== sw_sync.log ====="
            cat "$LOG"
          else
            echo "sw_sync.log was not created — script may have crashed before logging started."
          fi

      # ── 9. Upload debug screenshots if the run fails ─────────────────────
      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sw-sync-debug-screenshots
          path: "docs/Financial Workbook/PlaidSync/debug_*.png"
          if-no-files-found: ignore
          retention-days: 7

      # ── 10. Upload sync log (always) ─────────────────────────────────────
      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-sync-log
          path: "docs/Financial Workbook/PlaidSync/sw_sync.log"
          if-no-files-found: ignore
          retention-days: 7